[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-pressure-lab"
version = "0.1.0"
description = "Point-in-time ETF flow and liquidity research, not a live trading system"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
flowlab = "flowlab.cli:main"

[tool.setuptools.packages.find]
include = ["flowlab*"]

[tool.pytest.ini_options]
pythonpath = ["."]
